name: eduos_mobile
description: Osun EduOS app for parents, teachers and inspectors. Offline registers, scores and school inspections for Android and iOS.
publish_to: none
version: 0.6.0+6

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: 7.3.2
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  flutter_secure_storage: 11.2.0
  http: 1.6.0
  image_picker: 1.2.4
  intl: 0.20.3
  path: 1.9.1
  path_provider: 2.1.6
  provider: 6.1.5+1
  sqflite_common: 2.5.17
  sqflite_sqlcipher: 3.4.1
  uuid: 4.6.0
  workmanager: 0.10.10

# Pinned to releases at least two weeks old (newer ones have not had time for problems to surface).
dependency_overrides:
  image_picker_ios: 0.8.13+15
  _flutterfire_internals: 1.3.79
  firebase_core_platform_interface: 8.1.1
  firebase_core_web: 4.1.0
  firebase_messaging_platform_interface: 4.11.1
  firebase_messaging_web: 4.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: 2.4.7

flutter:
  uses-material-design: true
