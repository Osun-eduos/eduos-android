name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    needs: test
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      # Sign with the upload key when the repository has it (Settings > Secrets and variables > Actions):
      # secrets ANDROID_UPLOAD_KEYSTORE_BASE64 and ANDROID_UPLOAD_KEY_PASSWORD. Without them the APKs are
      # debug-signed: fine for testing, not for publishing.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        if: env.HAS_UPLOAD_KEY == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=eduos-upload\nkeyPassword=%s\n' "$RUNNER_TEMP/upload.jks" "$KEY_PASSWORD" "$KEY_PASSWORD" > android/key.properties
      # Server addresses come from repository variables EDUOS_API_URL and EDUOS_SYNC_URL when set.
      - run: >-
          flutter build apk --release --split-per-abi
          ${{ vars.EDUOS_API_URL && format('--dart-define=API_URL={0}', vars.EDUOS_API_URL) || '' }}
          ${{ vars.EDUOS_SYNC_URL && format('--dart-define=SYNC_URL={0}', vars.EDUOS_SYNC_URL) || '' }}
      - run: rm -f android/key.properties
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: eduos-teacher-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 14
